<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="plate-title plate-desc" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">
  <title id="plate-title">The Telephone for Calling Roads Not Taken</title>
  <desc id="plate-desc">A cream rotary telephone sits inside a glass case. Words instead of numbers circle its dial, and a second receiver rests behind it with a faint amber glow.</desc>

  <defs>
    <pattern id="grid-fine-3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 0,20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="grid-major-3" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine-3)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    </pattern>
    <clipPath id="grid-clip-3">
      <rect x="1" y="1" width="798" height="598"/>
    </clipPath>
  </defs>

  <g clip-path="url(#grid-clip-3)">
    <rect x="1" y="1" width="798" height="598" fill="url(#grid-major-3)"/>
  </g>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- FIG. 1 — main elevation -->
  <g id="fig-1">
    <text x="90" y="536" font-size="11" opacity="1">FIG. 1 — ELEVATION, FRONT</text>

    <!-- second receiver, resting behind -->
    <g class="glow">
      <circle cx="150" cy="150" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
      <circle cx="270" cy="150" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
      <path d="M164,140 Q210,124 256,140" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
      <path d="M164,160 Q210,144 256,160" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
    </g>

    <!-- body / base -->
    <rect x="90" y="255" width="240" height="205" rx="20" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- dial -->
    <g class="dial">
      <circle cx="210" cy="358" r="75" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
      <circle cx="210" cy="358" r="14" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="210" cy="283" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="257" cy="298" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="279" cy="340" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="279" cy="376" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="257" cy="418" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="210" cy="433" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="163" cy="418" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="141" cy="376" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="141" cy="340" r="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="210" y="277" font-size="9" text-anchor="middle" opacity="1">STAY</text>
      <text x="278" y="282" font-size="9" text-anchor="middle" opacity="1">LEAVE</text>
      <text x="310" y="336" font-size="9" text-anchor="middle" opacity="1">SPEAK</text>
      <text x="309" y="384" font-size="9" text-anchor="middle" opacity="1">WAIT</text>
      <text x="266" y="426" font-size="9" text-anchor="middle" opacity="1">ASK</text>
      <text x="210" y="450" font-size="9" text-anchor="middle" opacity="1">RETURN</text>
      <text x="150" y="426" font-size="9" text-anchor="middle" opacity="1">HOPE</text>
      <text x="115" y="380" font-size="9" text-anchor="middle" opacity="1">DOUBT</text>
      <text x="115" y="340" font-size="9" text-anchor="middle" opacity="1">BEGIN</text>
    </g>

    <!-- finger stop -->
    <rect x="289" y="351" width="10" height="14" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- cradle switch hook -->
    <rect x="195" y="246" width="30" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- cradle prongs -->
    <rect x="125" y="222" width="14" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="281" y="222" width="14" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- handset resting in cradle -->
    <circle cx="120" cy="210" r="22" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <circle cx="300" cy="210" r="22" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <path d="M140,195 Q210,172 280,195" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <path d="M140,225 Q210,202 280,225" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- coiled cord, dangling unconnected, exits the body's lower-right edge, clear of the dial and dimension -->
    <path d="M330,434 L352,440 L338,448 L358,454 L348,461" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
    <circle cx="348" cy="461" r="3" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>
  </g>

  <!-- FIG. 2 — detail view -->
  <g id="fig-2">
    <text x="620" y="64" font-size="13" text-anchor="middle" opacity="1">FIG. 2</text>
    <circle cx="620" cy="190" r="110" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <text x="620" y="316" font-size="10" text-anchor="middle" opacity="0.55">DETAIL — DIAL RIM, FINGER STOP, SCALE 2:1</text>

    <path d="M652,92 Q694,190 652,288" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <circle cx="612" cy="132" r="13" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="636" y="136" font-size="10" opacity="1">STAY</text>

    <circle cx="598" cy="190" r="13" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="622" y="194" font-size="10" opacity="1">SPEAK</text>

    <circle cx="612" cy="248" r="13" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="636" y="252" font-size="10" opacity="1">RETURN</text>

    <rect x="636" y="100" width="10" height="18" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="651" y="112" font-size="9" opacity="1">STOP</text>
  </g>

  <!-- zoom leader linking fig. 1 to fig. 2 -->
  <g opacity="0.55">
    <line x1="285" y1="330" x2="513" y2="150" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="285" y1="360" x2="513" y2="234" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <circle cx="285" cy="345" r="3" fill="currentColor" stroke="none"/>
  </g>

  <!-- callouts -->
  <g id="callouts">
    <line x1="233" y1="286" x2="356" y2="100" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="95" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="99" font-size="10" text-anchor="middle" opacity="1">1</text>
    <text x="380" y="99" font-size="10" opacity="1">WORD DIAL</text>

    <line x1="260" y1="150" x2="356" y2="182" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="180" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="184" font-size="10" text-anchor="middle" opacity="1">2</text>
    <text x="380" y="184" font-size="10" opacity="1">SECOND RECEIVER · WARM</text>

    <line x1="225" y1="251" x2="356" y2="270" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="265" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="269" font-size="10" text-anchor="middle" opacity="1">3</text>
    <text x="380" y="269" font-size="10" opacity="1">CRADLE SWITCH</text>

    <line x1="348" y1="461" x2="391" y2="455" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="455" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="459" font-size="10" text-anchor="middle" opacity="1">4</text>
    <text x="414" y="459" font-size="10" opacity="1">CORD · NEVER CONNECTED</text>
  </g>

  <!-- dimensions -->
  <g id="dimensions" opacity="0.55">
    <line x1="90" y1="251" x2="90" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="251" x2="330" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="78" x2="330" y2="78" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="78" x2="97" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="78" x2="97" y2="82" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="78" x2="323" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="78" x2="323" y2="82" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="210" y="70" font-size="10" text-anchor="middle">260 MM</text>

    <line x1="66" y1="188" x2="50" y2="188" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="66" y1="460" x2="50" y2="460" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="188" x2="58" y2="460" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="188" x2="54" y2="195" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="188" x2="62" y2="195" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="460" x2="54" y2="453" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="460" x2="62" y2="453" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="34" y="324" font-size="10" text-anchor="middle" transform="rotate(-90 34 324)">360 MM</text>

    <line x1="336" y1="283" x2="352" y2="283" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="336" y1="433" x2="352" y2="433" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="344" y1="283" x2="344" y2="433" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="360" y="358" font-size="10" text-anchor="middle" transform="rotate(-90 360 358)">150 MM</text>
  </g>

  <!-- compass / scale -->
  <g id="compass-scale">
    <line x1="60" y1="560" x2="200" y2="560" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="60" y1="554" x2="60" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="107" y1="554" x2="107" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="153" y1="554" x2="153" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="200" y1="554" x2="200" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="60" y="580" font-size="10" text-anchor="middle" opacity="1">0</text>
    <text x="107" y="580" font-size="10" text-anchor="middle" opacity="1">50</text>
    <text x="153" y="580" font-size="10" text-anchor="middle" opacity="1">100</text>
    <text x="200" y="580" font-size="10" text-anchor="middle" opacity="1">MM</text>

    <circle cx="350" cy="553" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="350" y1="539" x2="350" y2="567" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="334" y1="553" x2="366" y2="553" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="350" y="533" font-size="10" text-anchor="middle" opacity="1">N</text>
  </g>

  <!-- UNFINISHED stamp -->
  <g transform="rotate(-8 460 390)" opacity="1">
    <rect x="385" y="365" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="391" y="371" width="138" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="0.75" opacity="1"/>
    <text x="460" y="396" font-size="14" text-anchor="middle" opacity="1">UNFINISHED</text>
  </g>

  <!-- title block -->
  <g id="title-block">
    <rect x="555" y="478" width="225" height="104" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="555" y1="500" x2="780" y2="500" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="518" x2="780" y2="518" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="560" x2="780" y2="560" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="567" y="493" font-size="10" opacity="1">MUSEUM OF UNFINISHED FUTURES</text>
    <text x="567" y="513" font-size="10" opacity="1">PLATE NO. 003</text>
    <text x="773" y="513" font-size="10" text-anchor="end" opacity="1">SHEET 1/1</text>
    <text x="567" y="533" font-size="10" opacity="1">THE TELEPHONE FOR CALLING</text>
    <text x="567" y="547" font-size="10" opacity="1">ROADS NOT TAKEN</text>
    <text x="567" y="574" font-size="10" opacity="1">DRAWN — NEVER BUILT</text>
  </g>
</svg>
