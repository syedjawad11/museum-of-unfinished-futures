<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="plate-title plate-desc" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">
  <title id="plate-title">The Kettle That Brews the Weather of Past Visits</title>
  <desc id="plate-desc">A pale blue enamel kettle sits on a cast-iron trivet. A thin curl of grey cloud hangs above its spout, faint frost rims the spout's edge, and rows of small painted tally marks circle its base.</desc>

  <defs>
    <pattern id="grid-fine-6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 0,20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="grid-major-6" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine-6)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    </pattern>
    <clipPath id="grid-clip-6">
      <rect x="1" y="1" width="798" height="598"/>
    </clipPath>
  </defs>

  <g clip-path="url(#grid-clip-6)">
    <rect x="1" y="1" width="798" height="598" fill="url(#grid-major-6)"/>
  </g>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- FIG. 1 — main elevation -->
  <g id="fig-1">
    <text x="90" y="536" font-size="11" opacity="1">FIG. 1 — ELEVATION, SIDE</text>

    <!-- rising cloud above spout -->
    <g class="cloud">
      <path d="M262,150 Q248,138 260,126 Q252,110 270,104 Q280,90 298,100 Q314,94 318,110 Q332,112 328,128 Q336,142 320,148 Q322,158 306,158 Q296,168 282,158 Q266,164 262,150 Z" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
    </g>

    <!-- kettle dome body -->
    <path d="M150,260 Q150,190 210,190 Q270,190 270,260 L270,300 Q270,330 210,330 Q150,330 150,300 Z" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- lid + knob -->
    <ellipse cx="210" cy="190" rx="30" ry="8" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="210" y1="182" x2="210" y2="170" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <circle cx="210" cy="164" r="6" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- spout -->
    <path d="M262,220 Q296,210 306,180 Q310,168 300,166 Q292,176 284,196 Q272,214 254,232" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <!-- frost rim at spout edge -->
    <path d="M296,168 Q300,164 304,168" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>
    <path d="M292,176 Q296,172 300,176" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>

    <!-- handle -->
    <path d="M158,220 Q118,220 118,258 Q118,296 158,296" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- tally band around base -->
    <g id="tally-band">
      <line x1="160" y1="308" x2="160" y2="322" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="167" y1="309" x2="167" y2="323" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="174" y1="310" x2="174" y2="324" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="181" y1="310" x2="181" y2="324" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="159" y1="315" x2="184" y2="309" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

      <line x1="196" y1="311" x2="196" y2="325" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="203" y1="311" x2="203" y2="325" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="210" y1="311" x2="210" y2="325" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="217" y1="311" x2="217" y2="325" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="195" y1="317" x2="220" y2="317" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

      <line x1="232" y1="310" x2="232" y2="324" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="239" y1="309" x2="239" y2="323" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="246" y1="308" x2="246" y2="322" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    </g>

    <!-- trivet -->
    <line x1="130" y1="340" x2="290" y2="340" stroke="currentColor" stroke-width="1.5" opacity="1" fill="none"/>
    <line x1="140" y1="340" x2="120" y2="366" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="210" y1="340" x2="210" y2="368" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="280" y1="340" x2="300" y2="366" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
  </g>

  <!-- FIG. 2 — detail view -->
  <g id="fig-2">
    <text x="620" y="64" font-size="13" text-anchor="middle" opacity="1">FIG. 2</text>
    <circle cx="620" cy="190" r="110" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <text x="620" y="316" font-size="10" text-anchor="middle" opacity="0.55">DETAIL — TALLY BAND, SCALE 3:1</text>

    <path d="M552,190 Q620,146 688,190" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>

    <line x1="590" y1="176" x2="590" y2="204" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="602" y1="174" x2="602" y2="202" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="614" y1="172" x2="614" y2="200" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="626" y1="172" x2="626" y2="200" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="588" y1="190" x2="628" y2="184" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>

    <line x1="646" y1="176" x2="646" y2="204" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="658" y1="174" x2="658" y2="202" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="670" y1="172" x2="670" y2="200" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="682" y1="174" x2="682" y2="202" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="644" y1="190" x2="684" y2="184" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="618" y="234" font-size="9" text-anchor="middle" opacity="1">GROUPS OF 5</text>
  </g>

  <!-- zoom leader linking fig. 1 to fig. 2 -->
  <g opacity="0.55">
    <line x1="220" y1="317" x2="513" y2="150" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="220" y1="324" x2="513" y2="234" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <circle cx="220" cy="320" r="3" fill="currentColor" stroke="none"/>
  </g>

  <!-- callouts -->
  <g id="callouts">
    <line x1="300" y1="168" x2="356" y2="100" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="95" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="99" font-size="10" text-anchor="middle" opacity="1">1</text>
    <text x="380" y="99" font-size="10" opacity="1">SPOUT (FROSTED)</text>

    <line x1="298" y1="100" x2="356" y2="182" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="180" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="184" font-size="10" text-anchor="middle" opacity="1">2</text>
    <text x="380" y="184" font-size="10" opacity="1">WEATHER VENT</text>

    <line x1="210" y1="368" x2="356" y2="264" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="264" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="268" font-size="10" text-anchor="middle" opacity="1">3</text>
    <text x="380" y="268" font-size="10" opacity="1">TRIVET</text>

    <line x1="246" y1="315" x2="391" y2="335" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="335" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="339" font-size="10" text-anchor="middle" opacity="1">4</text>
    <text x="414" y="339" font-size="10" opacity="1">TALLY BAND</text>

    <line x1="118" y1="296" x2="391" y2="459" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="459" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="463" font-size="10" text-anchor="middle" opacity="1">5</text>
    <text x="414" y="463" font-size="10" opacity="1">HANDLE</text>
  </g>

  <!-- dimensions -->
  <g id="dimensions" opacity="0.55">
    <line x1="118" y1="76" x2="118" y2="56" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="306" y1="76" x2="306" y2="56" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="118" y1="60" x2="306" y2="60" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="212" y="52" font-size="10" text-anchor="middle">210 MM</text>

    <line x1="98" y1="190" x2="82" y2="190" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="98" y1="368" x2="82" y2="368" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="190" x2="90" y2="368" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="66" y="279" font-size="10" text-anchor="middle" transform="rotate(-90 66 279)">198 MM</text>

    <line x1="150" y1="336" x2="150" y2="404" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="270" y1="336" x2="270" y2="404" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="150" y1="400" x2="270" y2="400" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="210" y="416" font-size="10" text-anchor="middle">140 MM</text>
  </g>

  <!-- compass / scale -->
  <g id="compass-scale">
    <line x1="60" y1="560" x2="200" y2="560" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="60" y1="554" x2="60" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="107" y1="554" x2="107" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="153" y1="554" x2="153" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="200" y1="554" x2="200" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="60" y="580" font-size="10" text-anchor="middle" opacity="1">0</text>
    <text x="107" y="580" font-size="10" text-anchor="middle" opacity="1">50</text>
    <text x="153" y="580" font-size="10" text-anchor="middle" opacity="1">100</text>
    <text x="200" y="580" font-size="10" text-anchor="middle" opacity="1">MM</text>

    <circle cx="350" cy="553" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="350" y1="539" x2="350" y2="567" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="334" y1="553" x2="366" y2="553" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="350" y="533" font-size="10" text-anchor="middle" opacity="1">N</text>
  </g>

  <!-- UNFINISHED stamp -->
  <g transform="rotate(-8 460 390)" opacity="1">
    <rect x="385" y="365" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="391" y="371" width="138" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="0.75" opacity="1"/>
    <text x="460" y="396" font-size="14" text-anchor="middle" opacity="1">UNFINISHED</text>
  </g>

  <!-- title block -->
  <g id="title-block">
    <rect x="555" y="478" width="225" height="104" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="555" y1="500" x2="780" y2="500" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="518" x2="780" y2="518" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="560" x2="780" y2="560" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="567" y="493" font-size="10" opacity="1">MUSEUM OF UNFINISHED FUTURES</text>
    <text x="567" y="513" font-size="10" opacity="1">PLATE NO. 006</text>
    <text x="773" y="513" font-size="10" text-anchor="end" opacity="1">SHEET 1/1</text>
    <text x="567" y="528" font-size="10" opacity="1">THE KETTLE THAT</text>
    <text x="567" y="540" font-size="10" opacity="1">BREWS THE WEATHER</text>
    <text x="567" y="552" font-size="10" opacity="1">OF PAST VISITS</text>
    <text x="567" y="574" font-size="10" opacity="1">DRAWN — NEVER BUILT</text>
  </g>
</svg>
