<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="plate-title plate-desc" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">
  <title id="plate-title">The Switchboard for Conversations That Ended Too Soon</title>
  <desc id="plate-desc">A wooden operator's switchboard stands upright, its face covered in rows of brass jacks with tiny word labels, one left blank. Braided cords hang in loops below, and a small lamp glows beside the one connected cord.</desc>

  <defs>
    <pattern id="grid-fine-5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 0,20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="grid-major-5" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine-5)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    </pattern>
    <clipPath id="grid-clip-5">
      <rect x="1" y="1" width="798" height="598"/>
    </clipPath>
  </defs>

  <g clip-path="url(#grid-clip-5)">
    <rect x="1" y="1" width="798" height="598" fill="url(#grid-major-5)"/>
  </g>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- FIG. 1 — main elevation -->
  <g id="fig-1">
    <text x="90" y="536" font-size="11" opacity="1">FIG. 1 — ELEVATION, FRONT</text>

    <!-- cabinet -->
    <rect x="90" y="90" width="240" height="330" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="90" y1="116" x2="330" y2="116" stroke="currentColor" stroke-width="1" opacity="0.55" fill="none"/>

    <!-- jack field, 4 columns x 5 rows -->
    <g id="jack-field">
      <circle cx="128" cy="140" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="185" cy="140" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="242" cy="140" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="299" cy="140" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="128" y="158" font-size="8" text-anchor="middle" opacity="0.55">BECAUSE</text>
      <text x="185" y="158" font-size="8" text-anchor="middle" opacity="0.55">ANYWAY</text>
      <text x="242" y="158" font-size="8" text-anchor="middle" opacity="0.55">ACTUALLY</text>
      <text x="299" y="158" font-size="8" text-anchor="middle" opacity="0.55">WAIT</text>

      <circle cx="128" cy="176" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="185" cy="176" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="242" cy="176" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="299" cy="176" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="128" y="194" font-size="8" text-anchor="middle" opacity="0.55">SORRY</text>
      <text x="185" y="194" font-size="8" text-anchor="middle" opacity="0.55">MAYBE</text>
      <text x="242" y="194" font-size="8" text-anchor="middle" opacity="0.55">LATER</text>
      <text x="299" y="194" font-size="8" text-anchor="middle" opacity="0.55">STILL</text>

      <circle cx="128" cy="212" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="185" cy="212" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="242" cy="212" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="299" cy="212" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="128" y="230" font-size="8" text-anchor="middle" opacity="0.55">NEVER</text>
      <text x="185" y="230" font-size="8" text-anchor="middle" opacity="0.55">ALMOST</text>
      <text x="242" y="230" font-size="8" text-anchor="middle" opacity="0.55">ONCE</text>
      <text x="299" y="230" font-size="8" text-anchor="middle" opacity="0.55">ALWAYS</text>

      <circle cx="128" cy="248" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="185" cy="248" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="242" cy="248" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="299" cy="248" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="128" y="266" font-size="8" text-anchor="middle" opacity="0.55">HOME</text>
      <text x="185" y="266" font-size="8" text-anchor="middle" opacity="0.55">IF</text>
      <text x="242" y="266" font-size="8" text-anchor="middle" opacity="0.55">STAY</text>
      <text x="299" y="266" font-size="8" text-anchor="middle" opacity="0.55">GO</text>

      <circle cx="128" cy="284" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="185" cy="284" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="242" cy="284" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <circle cx="299" cy="284" r="7" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="128" y="302" font-size="8" text-anchor="middle" opacity="0.55">CALL</text>
      <text x="185" y="302" font-size="8" text-anchor="middle" opacity="0.55">SO</text>
      <text x="242" y="302" font-size="8" text-anchor="middle" opacity="0.55">THEN</text>
    </g>
    <!-- jack at 299,284 is left blank on purpose: no word label -->

    <!-- supervisory lamp beside the connected cord, clear of the WAIT label below -->
    <circle cx="299" cy="140" r="3" fill="currentColor" stroke="none" opacity="1"/>
    <circle cx="320" cy="140" r="5" fill="none" stroke="currentColor" stroke-width="0.75" opacity="1"/>
    <line x1="314" y1="134" x2="326" y2="146" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="326" y1="134" x2="314" y2="146" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

    <!-- cord plug shelf -->
    <rect x="100" y="330" width="220" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- connected cord, plugged into the WAIT jack, routed clear of the lamp and every jack below it -->
    <path d="M299,147 L310,156 L310,320 L260,320 L260,330" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- loose looped cords, hanging unconnected -->
    <path d="M180,344 Q170,375 190,390 Q210,405 195,420 Q182,432 200,344" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>
    <path d="M230,344 Q218,380 240,398 Q258,412 240,344" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>
    <path d="M280,344 Q268,372 288,386 Q305,398 288,344" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>

    <!-- cabinet feet -->
    <rect x="100" y="420" width="18" height="14" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="302" y="420" width="18" height="14" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
  </g>

  <!-- FIG. 2 — detail view -->
  <g id="fig-2">
    <text x="620" y="64" font-size="13" text-anchor="middle" opacity="1">FIG. 2</text>
    <circle cx="620" cy="190" r="110" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <text x="620" y="316" font-size="10" text-anchor="middle" opacity="0.55">DETAIL — LIT JACK, SCALE 3:1</text>

    <circle cx="600" cy="180" r="26" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <text x="600" y="185" font-size="10" text-anchor="middle" opacity="1">WAIT</text>
    <g class="lamp">
      <circle cx="655" cy="150" r="14" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <line x1="646" y1="141" x2="664" y2="159" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="664" y1="141" x2="646" y2="159" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    </g>
    <line x1="624" y1="170" x2="642" y2="156" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
  </g>

  <!-- zoom leader linking fig. 1 to fig. 2, anchored left/bottom of the WAIT jack, clear of the lamp -->
  <g opacity="0.55">
    <line x1="292" y1="140" x2="513" y2="150" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="299" y1="147" x2="513" y2="234" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <circle cx="299" cy="147" r="3" fill="currentColor" stroke="none"/>
  </g>

  <!-- callouts -->
  <g id="callouts">
    <line x1="304" y1="134" x2="356" y2="100" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="95" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="99" font-size="10" text-anchor="middle" opacity="1">1</text>
    <text x="380" y="99" font-size="10" opacity="1">JACK FIELD</text>

    <line x1="242" y1="158" x2="356" y2="182" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="180" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="184" font-size="10" text-anchor="middle" opacity="1">2</text>
    <text x="380" y="184" font-size="10" opacity="1">WORD LABEL</text>

    <line x1="320" y1="135" x2="356" y2="264" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="264" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="268" font-size="10" text-anchor="middle" opacity="1">3</text>
    <text x="380" y="268" font-size="10" opacity="1">SUPERVISORY LAMP</text>

    <line x1="230" y1="344" x2="391" y2="335" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="335" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="339" font-size="10" text-anchor="middle" opacity="1">4</text>
    <text x="414" y="339" font-size="10" opacity="1">CORD PAIR</text>

    <line x1="299" y1="284" x2="391" y2="459" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="459" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="463" font-size="10" text-anchor="middle" opacity="1">5</text>
    <text x="414" y="463" font-size="10" opacity="1">BLANK JACK</text>
  </g>

  <!-- dimensions -->
  <g id="dimensions" opacity="0.55">
    <line x1="90" y1="86" x2="90" y2="66" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="86" x2="330" y2="66" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="70" x2="330" y2="70" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="210" y="62" font-size="10" text-anchor="middle">460 MM</text>

    <line x1="66" y1="90" x2="50" y2="90" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="66" y1="420" x2="50" y2="420" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="90" x2="58" y2="420" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="34" y="255" font-size="10" text-anchor="middle" transform="rotate(-90 34 255)">610 MM</text>

    <line x1="97" y1="133" x2="113" y2="133" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="97" y1="169" x2="113" y2="169" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="105" y1="133" x2="105" y2="169" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="89" y="151" font-size="10" text-anchor="middle" transform="rotate(-90 89 151)">36 MM</text>
  </g>

  <!-- compass / scale -->
  <g id="compass-scale">
    <line x1="60" y1="560" x2="200" y2="560" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="60" y1="554" x2="60" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="107" y1="554" x2="107" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="153" y1="554" x2="153" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="200" y1="554" x2="200" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="60" y="580" font-size="10" text-anchor="middle" opacity="1">0</text>
    <text x="107" y="580" font-size="10" text-anchor="middle" opacity="1">50</text>
    <text x="153" y="580" font-size="10" text-anchor="middle" opacity="1">100</text>
    <text x="200" y="580" font-size="10" text-anchor="middle" opacity="1">MM</text>

    <circle cx="350" cy="553" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="350" y1="539" x2="350" y2="567" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="334" y1="553" x2="366" y2="553" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="350" y="533" font-size="10" text-anchor="middle" opacity="1">N</text>
  </g>

  <!-- UNFINISHED stamp -->
  <g transform="rotate(-8 460 390)" opacity="1">
    <rect x="385" y="365" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="391" y="371" width="138" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="0.75" opacity="1"/>
    <text x="460" y="396" font-size="14" text-anchor="middle" opacity="1">UNFINISHED</text>
  </g>

  <!-- title block -->
  <g id="title-block">
    <rect x="555" y="478" width="225" height="104" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="555" y1="500" x2="780" y2="500" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="518" x2="780" y2="518" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="560" x2="780" y2="560" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="567" y="493" font-size="10" opacity="1">MUSEUM OF UNFINISHED FUTURES</text>
    <text x="567" y="513" font-size="10" opacity="1">PLATE NO. 005</text>
    <text x="773" y="513" font-size="10" text-anchor="end" opacity="1">SHEET 1/1</text>
    <text x="567" y="528" font-size="10" opacity="1">THE SWITCHBOARD FOR</text>
    <text x="567" y="540" font-size="10" opacity="1">CONVERSATIONS THAT</text>
    <text x="567" y="552" font-size="10" opacity="1">ENDED TOO SOON</text>
    <text x="567" y="574" font-size="10" opacity="1">DRAWN — NEVER BUILT</text>
  </g>
</svg>
