<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="plate-title plate-desc" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">
  <title id="plate-title">The Toaster That Prints Notes From Your Future Self</title>
  <desc id="plate-desc">A rounded chrome toaster sits on a folded tea towel. Two slices stand half-risen in its slots, darkened with small handwriting, and its browning dial is marked in weeks instead of shades.</desc>

  <defs>
    <pattern id="grid-fine-4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 0,20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="grid-major-4" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine-4)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    </pattern>
    <clipPath id="grid-clip-4">
      <rect x="1" y="1" width="798" height="598"/>
    </clipPath>
  </defs>

  <g clip-path="url(#grid-clip-4)">
    <rect x="1" y="1" width="798" height="598" fill="url(#grid-major-4)"/>
  </g>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- FIG. 1 — main elevation -->
  <g id="fig-1">
    <text x="90" y="536" font-size="11" opacity="1">FIG. 1 — ELEVATION, FRONT</text>

    <!-- body -->
    <rect x="90" y="210" width="240" height="180" rx="24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- slot mouths -->
    <rect x="140" y="196" width="34" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="226" y="196" width="34" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- slices, half-risen -->
    <rect x="144" y="96" width="26" height="108" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <rect x="230" y="96" width="26" height="108" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- handwriting on slices -->
    <line x1="148" y1="130" x2="166" y2="130" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="148" y1="145" x2="166" y2="145" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="148" y1="160" x2="163" y2="160" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="234" y1="130" x2="252" y2="130" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="234" y1="145" x2="252" y2="145" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="234" y1="160" x2="249" y2="160" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

    <!-- browning dial -->
    <circle cx="210" cy="320" r="28" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="210" y1="286" x2="210" y2="292" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="210" y1="348" x2="210" y2="354" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="176" y1="320" x2="182" y2="320" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="238" y1="320" x2="244" y2="320" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="210" y1="320" x2="227" y2="302" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="210" y="281" font-size="9" text-anchor="middle" opacity="0.55">1 WK</text>
    <text x="210" y="368" font-size="9" text-anchor="middle" opacity="0.55">52 WK</text>

    <!-- carriage lever -->
    <path d="M330,320 L348,320 L348,270" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <circle cx="348" cy="266" r="6" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- crumb tray -->
    <rect x="100" y="372" width="220" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="195" y="386" width="30" height="6" rx="3" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>

    <!-- folded tea towel -->
    <path d="M70,410 Q90,398 110,410 T150,410 T190,410 T230,410 T270,410 T310,410 T350,410" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>
    <path d="M75,424 Q95,414 115,424 T155,424 T195,424 T235,424 T275,424 T315,424 T345,424" fill="none" stroke="currentColor" stroke-width="0.75" opacity="0.55"/>
  </g>

  <!-- FIG. 2 — detail view -->
  <g id="fig-2">
    <text x="620" y="64" font-size="13" text-anchor="middle" opacity="1">FIG. 2</text>
    <circle cx="620" cy="190" r="110" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <text x="620" y="316" font-size="10" text-anchor="middle" opacity="0.55">DETAIL — SLICE FACE, SCALE 2:1</text>

    <g class="slice">
      <rect x="585" y="110" width="70" height="150" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
      <line x1="595" y1="150" x2="645" y2="150" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="595" y1="170" x2="645" y2="170" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <line x1="595" y1="190" x2="640" y2="190" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <rect x="605" y="232" width="30" height="16" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
      <text x="620" y="244" font-size="9" text-anchor="middle" opacity="1">12 WK</text>
    </g>
  </g>

  <!-- zoom leader linking fig. 1 to fig. 2 -->
  <g opacity="0.55">
    <line x1="256" y1="150" x2="513" y2="150" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="256" y1="180" x2="513" y2="234" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <circle cx="256" cy="165" r="3" fill="currentColor" stroke="none"/>
  </g>

  <!-- callouts -->
  <g id="callouts">
    <line x1="256" y1="196" x2="356" y2="100" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="95" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="99" font-size="10" text-anchor="middle" opacity="1">1</text>
    <text x="380" y="99" font-size="10" opacity="1">SLOT 1 / SLOT 2</text>

    <line x1="222" y1="296" x2="356" y2="182" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="180" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="184" font-size="10" text-anchor="middle" opacity="1">2</text>
    <text x="380" y="184" font-size="10" opacity="1">BROWNING DIAL (WEEKS)</text>

    <line x1="348" y1="286" x2="356" y2="264" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="264" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="268" font-size="10" text-anchor="middle" opacity="1">3</text>
    <text x="380" y="268" font-size="10" opacity="1">CARRIAGE LEVER</text>

    <line x1="300" y1="381" x2="391" y2="335" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="335" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="339" font-size="10" text-anchor="middle" opacity="1">4</text>
    <text x="414" y="339" font-size="10" opacity="1">CRUMB TRAY</text>
  </g>

  <!-- dimensions -->
  <g id="dimensions" opacity="0.55">
    <line x1="90" y1="76" x2="90" y2="56" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="76" x2="330" y2="56" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="60" x2="330" y2="60" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="210" y="52" font-size="10" text-anchor="middle">254 MM</text>

    <line x1="66" y1="96" x2="50" y2="96" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="66" y1="424" x2="50" y2="424" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="96" x2="58" y2="424" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="34" y="264" font-size="10" text-anchor="middle" transform="rotate(-90 34 264)">328 MM</text>

    <line x1="244" y1="292" x2="260" y2="292" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="244" y1="348" x2="260" y2="348" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="252" y1="292" x2="252" y2="348" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="268" y="320" font-size="10" text-anchor="middle" transform="rotate(-90 268 320)">56 MM</text>
  </g>

  <!-- compass / scale -->
  <g id="compass-scale">
    <line x1="60" y1="560" x2="200" y2="560" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="60" y1="554" x2="60" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="107" y1="554" x2="107" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="153" y1="554" x2="153" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="200" y1="554" x2="200" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="60" y="580" font-size="10" text-anchor="middle" opacity="1">0</text>
    <text x="107" y="580" font-size="10" text-anchor="middle" opacity="1">50</text>
    <text x="153" y="580" font-size="10" text-anchor="middle" opacity="1">100</text>
    <text x="200" y="580" font-size="10" text-anchor="middle" opacity="1">MM</text>

    <circle cx="350" cy="553" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="350" y1="539" x2="350" y2="567" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="334" y1="553" x2="366" y2="553" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="350" y="533" font-size="10" text-anchor="middle" opacity="1">N</text>
  </g>

  <!-- UNFINISHED stamp -->
  <g transform="rotate(-8 460 390)" opacity="1">
    <rect x="385" y="365" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="391" y="371" width="138" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="0.75" opacity="1"/>
    <text x="460" y="396" font-size="14" text-anchor="middle" opacity="1">UNFINISHED</text>
  </g>

  <!-- title block -->
  <g id="title-block">
    <rect x="555" y="478" width="225" height="104" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="555" y1="500" x2="780" y2="500" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="518" x2="780" y2="518" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="560" x2="780" y2="560" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="567" y="493" font-size="10" opacity="1">MUSEUM OF UNFINISHED FUTURES</text>
    <text x="567" y="513" font-size="10" opacity="1">PLATE NO. 004</text>
    <text x="773" y="513" font-size="10" text-anchor="end" opacity="1">SHEET 1/1</text>
    <text x="567" y="528" font-size="10" opacity="1">THE TOASTER THAT</text>
    <text x="567" y="540" font-size="10" opacity="1">PRINTS NOTES FROM</text>
    <text x="567" y="552" font-size="10" opacity="1">YOUR FUTURE SELF</text>
    <text x="567" y="574" font-size="10" opacity="1">DRAWN — NEVER BUILT</text>
  </g>
</svg>
