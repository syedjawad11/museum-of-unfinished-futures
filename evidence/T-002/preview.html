  html, body {

  main {

  }
  /* Variant A: <img> tag — does NOT inherit currentColor, shown for
     comparison only. The tint/glow filter is applied to the wrapper but
     an <img>'s internal SVG paint (currentColor) is resolved inside the
     image document, not against the page's cascade, so strokes drawn
     with currentColor stay at the SVG's own default text colour
     (browser default: black) and will NOT pick up the amber tint. The
     drop-shadow glow still applies to the opaque pixels of the image. */
  .img-wrapper {
    color: #f2b65a;
    filter: drop-shadow(0 0 6px currentColor);
    background: #07090d;
  }

  /* Variant B: inline SVG (markup pasted directly into this document) —
     DOES inherit currentColor from the wrapper, so strokes painted with
     currentColor pick up the amber tint and the drop-shadow glows in
     that colour. This is the variant that matches how the plate will
     actually look once tinted per wing on the real page. */
  .inline-wrapper {
    color: #f2b65a;
    filter: drop-shadow(0 0 6px currentColor);
    background: #07090d;
  }
  .inline-wrapper svg {
    width: 800px;
    height: 600px;
    display: block;
  }
</style>
