<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="plate-title plate-desc" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" font-family="ui-monospace, 'IBM Plex Mono', Menlo, Consolas, monospace" letter-spacing="0.08em">
  <title id="plate-title">The Umbrella That Remembers Every Storm</title>
  <desc id="plate-desc">A translucent umbrella is displayed open above a dark pedestal. Suspended silver droplets glow beneath its canopy, and rows of tiny dates are engraved into its brass handle.</desc>

  <defs>
    <pattern id="grid-fine-2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20,0 L0,0 0,20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>
    </pattern>
    <pattern id="grid-major-2" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-fine-2)"/>
      <path d="M100,0 L0,0 0,100" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>
    </pattern>
    <clipPath id="grid-clip-2">
      <rect x="1" y="1" width="798" height="598"/>
    </clipPath>
  </defs>

  <g clip-path="url(#grid-clip-2)">
    <rect x="1" y="1" width="798" height="598" fill="url(#grid-major-2)"/>
  </g>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="currentColor" stroke-width="1" opacity="0.12"/>

  <!-- FIG. 1 — main elevation -->
  <g id="fig-1">
    <text x="90" y="536" font-size="11" opacity="1">FIG. 1 — ELEVATION, SIDE</text>

    <!-- finial -->
    <circle cx="210" cy="98" r="3" fill="currentColor" stroke="none" opacity="1"/>

    <!-- pole / shaft -->
    <line x1="210" y1="100" x2="210" y2="340" stroke="currentColor" stroke-width="1.5" opacity="1" fill="none"/>

    <!-- canopy dome outline -->
    <path d="M90,215 Q210,108 330,215" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- canopy scalloped rim (panel seams) -->
    <path d="M90,215 L120,227 L150,215 L180,227 L210,215 L240,227 L270,215 L300,227 L330,215" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>

    <!-- ribs -->
    <line x1="210" y1="108" x2="90" y2="215" stroke="currentColor" stroke-width="1" opacity="0.55" fill="none"/>
    <line x1="210" y1="108" x2="150" y2="215" stroke="currentColor" stroke-width="1" opacity="0.55" fill="none"/>
    <line x1="210" y1="108" x2="270" y2="215" stroke="currentColor" stroke-width="1" opacity="0.55" fill="none"/>
    <line x1="210" y1="108" x2="330" y2="215" stroke="currentColor" stroke-width="1" opacity="0.55" fill="none"/>

    <!-- runner and stretchers -->
    <rect x="203" y="248" width="14" height="12" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="210" y1="254" x2="150" y2="205" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="210" y1="254" x2="270" y2="205" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

    <!-- suspended droplets -->
    <g class="droplets">
      <line x1="90" y1="219" x2="90" y2="246" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <circle cx="90" cy="250" r="3" fill="currentColor" stroke="none" opacity="0.55"/>
      <line x1="150" y1="219" x2="150" y2="246" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <circle cx="150" cy="250" r="3" fill="currentColor" stroke="none" opacity="0.55"/>
      <line x1="210" y1="219" x2="210" y2="246" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <circle cx="210" cy="250" r="3" fill="currentColor" stroke="none" opacity="0.55"/>
      <line x1="270" y1="219" x2="270" y2="246" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <circle cx="270" cy="250" r="3" fill="currentColor" stroke="none" opacity="0.55"/>
      <line x1="330" y1="219" x2="330" y2="246" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
      <circle cx="330" cy="250" r="3" fill="currentColor" stroke="none" opacity="0.55"/>
    </g>

    <!-- engraving ticks on shaft, above handle -->
    <line x1="204" y1="300" x2="216" y2="300" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="204" y1="312" x2="216" y2="312" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="204" y1="324" x2="216" y2="324" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

    <!-- brass handle -->
    <path d="M210,340 L210,382 Q210,406 186,406 Q164,406 164,388" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>

    <!-- storm counter dial -->
    <circle cx="210" cy="460" r="10" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="210" y1="460" x2="216" y2="453" stroke="currentColor" stroke-width="0.75" opacity="1" fill="none"/>
    <line x1="210" y1="452" x2="210" y2="450" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>

    <!-- pedestal -->
    <line x1="155" y1="430" x2="265" y2="430" stroke="currentColor" stroke-width="1.5" opacity="1" fill="none"/>
    <rect x="170" y="430" width="80" height="65" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
  </g>

  <!-- FIG. 2 — detail view -->
  <g id="fig-2">
    <text x="620" y="64" font-size="13" text-anchor="middle" opacity="1">FIG. 2</text>
    <circle cx="620" cy="190" r="110" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <text x="620" y="316" font-size="10" text-anchor="middle" opacity="0.55">DETAIL — HANDLE ENGRAVING, SCALE 3:1</text>

    <path d="M620,100 C650,118 650,158 620,188 C598,210 598,240 622,262" fill="none" stroke="currentColor" stroke-width="1" opacity="0.55"/>

    <rect x="583" y="118" width="74" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="620" y="134" font-size="10" text-anchor="middle" opacity="1">12 MAR</text>

    <rect x="583" y="160" width="74" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="620" y="176" font-size="10" text-anchor="middle" opacity="1">03 OCT</text>

    <rect x="583" y="202" width="74" height="24" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="620" y="218" font-size="10" text-anchor="middle" opacity="1">31 NOV</text>
  </g>

  <!-- zoom leader linking fig. 1 to fig. 2 -->
  <g opacity="0.55">
    <line x1="216" y1="360" x2="513" y2="150" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="216" y1="376" x2="513" y2="234" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <circle cx="216" cy="368" r="3" fill="currentColor" stroke="none"/>
  </g>

  <!-- callouts -->
  <g id="callouts">
    <line x1="270" y1="150" x2="356" y2="100" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="95" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="99" font-size="10" text-anchor="middle" opacity="1">1</text>
    <text x="380" y="99" font-size="10" opacity="1">CANOPY · TRANSLUCENT</text>

    <line x1="170" y1="240" x2="356" y2="182" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="180" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="184" font-size="10" text-anchor="middle" opacity="1">2</text>
    <text x="380" y="184" font-size="10" opacity="1">DROPLET SUSPENSION</text>

    <line x1="216" y1="312" x2="356" y2="270" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="365" cy="265" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="365" y="269" font-size="10" text-anchor="middle" opacity="1">3</text>
    <text x="380" y="269" font-size="10" opacity="1">DATE ENGRAVING</text>

    <line x1="220" y1="460" x2="391" y2="455" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <circle cx="400" cy="455" r="9" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <text x="400" y="459" font-size="10" text-anchor="middle" opacity="1">4</text>
    <text x="414" y="459" font-size="10" opacity="1">STORM COUNTER</text>
  </g>

  <!-- dimensions -->
  <g id="dimensions" opacity="0.55">
    <line x1="90" y1="211" x2="90" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="211" x2="330" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="78" x2="330" y2="78" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="78" x2="97" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="90" y1="78" x2="97" y2="82" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="78" x2="323" y2="74" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="330" y1="78" x2="323" y2="82" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="210" y="70" font-size="10" text-anchor="middle">480 MM</text>

    <line x1="66" y1="100" x2="50" y2="100" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="66" y1="495" x2="50" y2="495" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="100" x2="58" y2="495" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="100" x2="54" y2="107" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="100" x2="62" y2="107" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="495" x2="54" y2="488" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="58" y1="495" x2="62" y2="488" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="34" y="297" font-size="10" text-anchor="middle" transform="rotate(-90 34 297)">710 MM</text>

    <line x1="290" y1="340" x2="306" y2="340" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="290" y1="406" x2="306" y2="406" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <line x1="298" y1="340" x2="298" y2="406" stroke="currentColor" stroke-width="0.75" fill="none"/>
    <text x="312" y="373" font-size="10" text-anchor="middle" transform="rotate(-90 312 373)">66 MM</text>
  </g>

  <!-- compass / scale -->
  <g id="compass-scale">
    <line x1="60" y1="560" x2="200" y2="560" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="60" y1="554" x2="60" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="107" y1="554" x2="107" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="153" y1="554" x2="153" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <line x1="200" y1="554" x2="200" y2="566" stroke="currentColor" stroke-width="1" opacity="1" fill="none"/>
    <text x="60" y="580" font-size="10" text-anchor="middle" opacity="1">0</text>
    <text x="107" y="580" font-size="10" text-anchor="middle" opacity="1">50</text>
    <text x="153" y="580" font-size="10" text-anchor="middle" opacity="1">100</text>
    <text x="200" y="580" font-size="10" text-anchor="middle" opacity="1">MM</text>

    <circle cx="350" cy="553" r="16" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <line x1="350" y1="539" x2="350" y2="567" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="334" y1="553" x2="366" y2="553" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="350" y="533" font-size="10" text-anchor="middle" opacity="1">N</text>
  </g>

  <!-- UNFINISHED stamp -->
  <g transform="rotate(-8 460 390)" opacity="1">
    <rect x="385" y="365" width="150" height="50" rx="8" fill="none" stroke="currentColor" stroke-width="1" opacity="1"/>
    <rect x="391" y="371" width="138" height="38" rx="5" fill="none" stroke="currentColor" stroke-width="0.75" opacity="1"/>
    <text x="460" y="396" font-size="14" text-anchor="middle" opacity="1">UNFINISHED</text>
  </g>

  <!-- title block -->
  <g id="title-block">
    <rect x="555" y="478" width="225" height="104" fill="none" stroke="currentColor" stroke-width="1.5" opacity="1"/>
    <line x1="555" y1="500" x2="780" y2="500" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="518" x2="780" y2="518" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <line x1="555" y1="560" x2="780" y2="560" stroke="currentColor" stroke-width="0.75" opacity="0.55" fill="none"/>
    <text x="567" y="493" font-size="10" opacity="1">MUSEUM OF UNFINISHED FUTURES</text>
    <text x="567" y="513" font-size="10" opacity="1">PLATE NO. 002</text>
    <text x="773" y="513" font-size="10" text-anchor="end" opacity="1">SHEET 1/1</text>
    <text x="567" y="533" font-size="10" opacity="1">THE UMBRELLA THAT</text>
    <text x="567" y="547" font-size="10" opacity="1">REMEMBERS EVERY STORM</text>
    <text x="567" y="574" font-size="10" opacity="1">DRAWN — NEVER BUILT</text>
  </g>
</svg>
